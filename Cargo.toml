[package]
name = "shakespeare-ai"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "An OpenAI-compatible AI provider with Nostr (NIP-98) auth and prepaid credits"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path"] }
base64 = "0.22"
bitcoin = { version = "0.32", default-features = false, features = ["std"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hmac = "0.12"
indexmap = { version = "2", features = ["serde"] }
md-5 = "0.10"
parking_lot = "0.12"
percent-encoding = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rust_decimal = "1"
secp256k1 = { version = "0.30", features = ["global-context"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
url = { version = "2", features = ["serde"] }

[features]
# Compile dashboard/dist into the binary (see build.rs). Without it the
# dashboard is read from disk, so it can be rebuilt while the server runs.
embedded-dashboard = []

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
