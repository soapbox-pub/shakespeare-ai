# Shakespeare AI configuration.
#
# Any secret may be written as ${ENV_VAR} to read it from the environment.

listen: 127.0.0.1:8000

# Where to serve Prometheus metrics (/metrics), apart from clients. Unset,
# they aren't served.
metrics_listen: 127.0.0.1:9100

# The header the reverse proxy puts the client's IP in: x-real-ip, or
# x-forwarded-for (its last address). Rate limits and logs go by it. Unset,
# it's the address that connected, which behind a proxy is the proxy's.
real_ip_header: x-real-ip

# The public URL clients reach this service at. NIP-98 auth events are signed
# for it, so it must match what clients see, not what this process sees.
origin: https://ai.shakespeare.diy

# SQLite database. A relative path is relative to this file.
database: shakespeare-ai.sqlite3

payments:
  # Charged on top of the credits bought: 0.1 is 10%.
  fee: 0.1
  # The fewest dollars one payment or gift card may be for.
  minimum: 5
  stripe:
    secret_key: ${STRIPE_SECRET_KEY}
    webhook_secret: ${STRIPE_WEBHOOK_SECRET}
  lightning:
    # The address's LNURL-pay server must return a LUD-21 `verify` URL with
    # each invoice; that's how payment is confirmed. (LNbits' lnurlp doesn't.)
    address: credits@example.com
  bitcoin:
    # A native segwit (BIP84) account's extended public key: zpub or xpub on
    # mainnet, vpub or tpub on testnet. Watch-only; each payment is sent to
    # the next receive address. Raise the wallet's gap limit, since unpaid
    # payments leave unused addresses. (This one is BIP84's test vector, whose
    # seed is public: replace it.)
    xpub: zpub6rFR7y4Q2AijBEqTUquhVz398htDFrtymD9xYYfG1m4wAcvPhXNfE3EfH1r1ADqtfSdVCToUG868RvUUkgDKf31mGDtKsAYz2oz2AGutZYs
    # An Esplora API. Ours, on our own node, by default; required for a
    # testnet key, such as https://mempool.space/testnet4/api.
    # esplora: https://btc.soapbox.pub/api
    # How many blocks deep a payment must be before it's credited.
    confirmations: 1

# How hard to try a model's upstreams. A request falls over to the next one
# when an upstream can't be reached, is overloaded or down (408, 429, 5xx),
# refuses our credentials (401-403) or hasn't got the model (404); never when
# it refuses the request itself (another 4xx), which would fail the same way
# anywhere, and never once anything has reached the client.
routing:
  connect_timeout: 10s
  # How long a stream's first byte may take. (Non-streaming responses come
  # whole, however long the completion takes, so only streams have it.)
  first_byte_timeout: 60s
  # After this many failures in a row, an upstream goes to the back of the
  # line for `cooldown`.
  failures: 3
  cooldown: 30s

# Upstream APIs. `api` is the protocol: `openai`; `openrouter`, OpenAI's with
# OpenRouter's extras (usage accounting, which records what each request cost
# us, and prompt caching breakpoints for anthropic/ models); or `anthropic`,
# Anthropic's Messages API, with prompt caching (chat only). `base_url`
# defaults to the usual one for `api`.
providers:
  anthropic:
    api: anthropic
    api_key: ${ANTHROPIC_API_KEY}
  openrouter:
    api: openrouter
    api_key: ${OPENROUTER_API_KEY}
  openai:
    api: openai
    api_key: ${OPENAI_API_KEY}

# What clients ask for, by id.
#
# `type` says which endpoint serves a model, and so how it's priced: `chat`
# for /v1/chat/completions, with a `context_window` and a price per million
# tokens, or `image` for /v1/images/generations, priced per image.
#
# `upstreams` are tried in order. Each is provider/model, everything after the
# first slash being the provider's own model id, or the long form
# `{ provider, model, params }`, whose `params` are merged into each request
# body sent that way.
#
# Chat prices are USD per million tokens, and are what the client pays
# whichever upstream serves it. `cache_read` and `cache_write` price cached
# input, and default to `input`. `hidden` keeps a model out of /v1/models
# without disabling it; free chat models are always hidden.
models:
  claude-sonnet-4.6:
    type: chat
    name: Claude Sonnet 4.6
    description: Highly capable programming model, able to understand and perform complex tasks.
    context_window: 200000
    price: { input: 3, output: 15, cache_read: 0.3, cache_write: 3.75 }
    upstreams:
      - anthropic/claude-sonnet-4-6
      - openrouter/anthropic/claude-sonnet-4.6

  claude-opus-4.8:
    type: chat
    name: Claude Opus 4.8
    description: If money is no obstacle, this model can get the job done.
    context_window: 200000
    price: { input: 5, output: 25, cache_read: 0.5, cache_write: 6.25 }
    upstreams: [anthropic/claude-opus-4-8]

  claude-sonnet-4.5:
    type: chat
    name: Claude Sonnet 4.5
    hidden: true
    context_window: 200000
    price: { input: 3, output: 15, cache_read: 0.3, cache_write: 3.75 }
    upstreams: [anthropic/claude-sonnet-4-5-20250929]

  claude-opus-4.5:
    type: chat
    name: Claude Opus 4.5
    hidden: true
    context_window: 200000
    price: { input: 5, output: 25, cache_read: 0.5, cache_write: 6.25 }
    upstreams: [anthropic/claude-opus-4-5-20251101]

  claude-opus-4.6:
    type: chat
    name: Claude Opus 4.6
    hidden: true
    context_window: 200000
    price: { input: 5, output: 25, cache_read: 0.5, cache_write: 6.25 }
    upstreams: [anthropic/claude-opus-4-6]

  # Hidden: they misbehave in Shakespeare for now.
  claude-sonnet-5:
    type: chat
    name: Claude Sonnet 5
    hidden: true
    context_window: 200000
    price: { input: 2, output: 10, cache_read: 0.2, cache_write: 2.5 }
    upstreams: [anthropic/claude-sonnet-5]

  claude-opus-5:
    type: chat
    name: Claude Opus 5
    hidden: true
    context_window: 200000
    price: { input: 5, output: 25, cache_read: 0.5, cache_write: 6.25 }
    upstreams: [anthropic/claude-opus-5]

  # Free, and so unlisted; Ditto's buddy uses it by id.
  gemma-4-26b:
    type: chat
    name: Gemma 4 26B A4B
    description: Google DeepMind's instruction-tuned Mixture-of-Experts model.
    context_window: 262144
    price: { input: 0, output: 0 }
    upstreams:
      - provider: openrouter
        model: google/gemma-4-26b-a4b-it
        # Merged into the request: here, it could pin OpenRouter's own routing.
        # params: { provider: { order: [deepinfra], allow_fallbacks: false } }

  # Image models are priced per image, by quality and shape, and need
  # providers with api: openai.
  gpt-image-1:
    type: image
    name: GPT Image 1
    description: Generate high-quality images from text descriptions.
    price:
      low: { square: 0.011, wide: 0.016 }
      medium: { square: 0.042, wide: 0.063 }
      high: { square: 0.167, wide: 0.25 }
    upstreams: [openai/gpt-image-1]
